# Customer Success FTE — Docker Compose (Local Development)
# Phase 2: Specialization
#
# Usage: docker-compose up -d
# This starts PostgreSQL, Kafka, and the FTE API locally.

services:
  # ─── PostgreSQL Database ─────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: fte-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fte_db}
      POSTGRES_USER: ${POSTGRES_USER:-fte_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fte_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./production/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fte_user} -d ${POSTGRES_DB:-fte_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fte-network

  # ─── Kafka (with Zookeeper) ──────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: fte-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - fte-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: fte-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - fte-network

  # ─── FTE API Server ──────────────────────────────────────────────────
  fte-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fte-api
    command: uvicorn production.api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-fte_db}
      POSTGRES_USER: ${POSTGRES_USER:-fte_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fte_password}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-placeholder}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      GMAIL_ENABLED: ${GMAIL_ENABLED:-false}
      GMAIL_CREDENTIALS_PATH: /app/credentials/gmail_oauth.json
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
      WEBFORM_ENABLED: ${WEBFORM_ENABLED:-true}
    volumes:
      - ./production:/app/production
      - ./incubation:/app/incubation
      - ./context:/app/context
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - fte-network

  # ─── FTE Message Processor Worker ────────────────────────────────────
  fte-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fte-worker
    command: python -m production.workers.message_processor
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-fte_db}
      POSTGRES_USER: ${POSTGRES_USER:-fte_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fte_password}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-placeholder}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
    volumes:
      - ./production:/app/production
      - ./incubation:/app/incubation
      - ./context:/app/context
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - fte-network

# ─── Volumes ──────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local

# ─── Networks ─────────────────────────────────────────────────────────────
networks:
  fte-network:
    driver: bridge
