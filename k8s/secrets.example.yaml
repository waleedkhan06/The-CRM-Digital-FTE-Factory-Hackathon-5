# Customer Success FTE — Kubernetes Secrets Template
# ⚠️ In production, use external secret management (Vault, AWS Secrets Manager, Sealed Secrets, etc.)
# Copy this file to secrets.yaml and replace placeholders with your actual secrets.
apiVersion: v1
kind: Secret
metadata:
  name: fte-secrets
  namespace: customer-success-fte
  labels:
    app: customer-success-fte
type: Opaque
stringData:
  # ─── Database ────────────────────────────────────────────────────────
  POSTGRES_PASSWORD: "YOUR_POSTGRES_PASSWORD_HERE"
  POSTGRES_USER: "postgres"
  POSTGRES_DB: "hackathon5"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"

  # ─── OpenAI ──────────────────────────────────────────────────────────
  OPENAI_API_KEY: "YOUR_OPENAI_API_KEY_HERE"

  # ─── Groq (Free LLM) ─────────────────────────────────────────────────
  GROQ_API_KEY: "YOUR_GROQ_API_KEY_HERE"
  GROQ_MODEL: "llama-3.3-70b-versatile"

  # ─── OpenRouter (Fallback LLM) ───────────────────────────────────────
  OPENROUTER_API_KEY: "YOUR_OPENROUTER_API_KEY_HERE"
  OPENROUTER_MODEL: "tencent/hy3-preview:free"

  # ─── Meta WhatsApp Cloud API ─────────────────────────────────────────
  META_WA_PHONE_NUMBER_ID: "YOUR_META_WA_PHONE_NUMBER_ID"
  META_WA_ACCESS_TOKEN: "YOUR_META_WA_ACCESS_TOKEN"
  META_WA_VERIFY_TOKEN: "YOUR_META_WA_VERIFY_TOKEN"

  # ─── Gmail ───────────────────────────────────────────────────────────
  GMAIL_CREDENTIALS_PATH: "/secrets/gmail/credentials.json"
  GMAIL_ENABLED: "false"

  # ─── Kafka ───────────────────────────────────────────────────────────
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  KAFKA_GROUP_ID: "fte-message-processor"

  # ─── CORS Origins ────────────────────────────────────────────────────
  ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:8000"
