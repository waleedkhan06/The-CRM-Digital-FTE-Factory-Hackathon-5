# Customer Success FTE — Kubernetes ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: fte-config
  namespace: customer-success-fte
  labels:
    app: customer-success-fte
data:
  # ─── Environment ─────────────────────────────────────────────────────
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"

  # ─── Database ────────────────────────────────────────────────────────
  POSTGRES_HOST: "postgres.customer-success-fte.svc.cluster.local"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "fte_db"

  # ─── Kafka ───────────────────────────────────────────────────────────
  KAFKA_BOOTSTRAP_SERVERS: "kafka.kafka.svc.cluster.local:9092"
  KAFKA_GROUP_ID: "fte-message-processor"

  # ─── Channel Configs ─────────────────────────────────────────────────
  GMAIL_ENABLED: "true"
  WHATSAPP_ENABLED: "true"
  WEBFORM_ENABLED: "true"

  # ─── Response Limits ─────────────────────────────────────────────────
  MAX_EMAIL_LENGTH: "2000"
  MAX_WHATSAPP_LENGTH: "1600"
  MAX_WEBFORM_LENGTH: "1000"

  # ─── Agent Behavior ──────────────────────────────────────────────────
  ESCALATION_SENTIMENT_THRESHOLD: "0.3"
  CONVERSATION_WINDOW_HOURS: "24"
  MAX_KB_RESULTS: "5"

  # ─── OpenAI ──────────────────────────────────────────────────────────
  OPENAI_MODEL: "gpt-4o"
  OPENAI_MAX_TOKENS: "1024"
  OPENAI_TEMPERATURE: "0.3"
