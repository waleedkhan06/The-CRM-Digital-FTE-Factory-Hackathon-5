# Customer Success FTE — Kubernetes Secrets
# ⚠️ In production, use external secret management (Vault, AWS Secrets Manager, etc.)
apiVersion: v1
kind: Secret
metadata:
  name: fte-secrets
  namespace: customer-success-fte
  labels:
    app: customer-success-fte
type: Opaque
stringData:
  # ─── Database ────────────────────────────────────────────────────────
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
  POSTGRES_USER: "fte_user"

  # ─── OpenAI ──────────────────────────────────────────────────────────
  OPENAI_API_KEY: "${OPENAI_API_KEY}"

  # ─── Gmail ───────────────────────────────────────────────────────────
  GMAIL_CREDENTIALS_PATH: "/secrets/gmail/credentials.json"

  # ─── Twilio/WhatsApp ─────────────────────────────────────────────────
  TWILIO_ACCOUNT_SID: "${TWILIO_ACCOUNT_SID}"
  TWILIO_AUTH_TOKEN: "${TWILIO_AUTH_TOKEN}"
  TWILIO_WHATSAPP_NUMBER: "whatsapp:+14155238886"

  # ─── CORS Origins ────────────────────────────────────────────────────
  ALLOWED_ORIGINS: "*"
